# P-35 / L6 — Retrieval-key durability for Property Explorer.
#
# Source of truth: GCP Secret Manager hauska-prod-497015 / HAUSKA_ENGINE_API_KEY
# (same secret retrieval-api mounts as RETRIEVAL_API_KEY and MCP mounts as
# HAUSKA_ENGINE_API_KEY). This workflow pulls that secret and authoritative-
# replaces the Vercel production env for project property-explorer, then
# redeploys so a rotation cannot strand PE.
#
# Traps baked in (see _STATE.md 2026-08-10 PE outage notes):
#   1) Assert VERCEL_PROJECT_ID == property-explorer (never cmdcenter)
#   2) Wire BOTH HAUSKA_RETRIEVAL_API_KEY and RETRIEVAL_API_KEY (do not rename code)
#   3) Write key with printf '%s' and assert byte length (no stdin newline)
#   4) Workflow deploy is intentional authoritative-replace of manual env
#   5) Cloud Run :latest re-resolve is MCP/retrieval's half — not this file
#   6) Live verify is a gated PE facets probe, not a bare 200 on /
#
# Required GitHub secrets (repo empressaioemail-tech/hauska-map):
#   VERCEL_TOKEN           — MUST be a personal token from
#                            https://vercel.com/account/tokens
#                            (CLI OAuth auth.json token is NOT valid for --token)
#   VERCEL_ORG_ID          (= team_4TH5lNnFHcBGx4EKNapJ2MVG)
#   VERCEL_PROJECT_ID      (= prj_vcZGXbqdffk5C20WzaplEpzFynK3)  # property-explorer ONLY
#   GCP_SA_KEY_HAUSKA_PROD (JSON SA key with secretmanager.secretAccessor on HAUSKA_ENGINE_API_KEY)
#
# Rotation path: add SM version → redeploy retrieval-api → redeploy MCP → run this workflow.

name: PE sync retrieval key

on:
  workflow_dispatch:
  repository_dispatch:
    types: [pe-retrieval-key-sync]
  push:
    branches: [main]
    paths:
      - ".github/workflows/property-explorer-sync-retrieval-key.yml"

permissions:
  contents: read

env:
  # Hard-pin the property-explorer project id (trap 1). Do not change without
  # re-reading .vercel/project.json after `vercel link --project property-explorer`.
  EXPECTED_VERCEL_PROJECT_ID: prj_vcZGXbqdffk5C20WzaplEpzFynK3
  EXPECTED_VERCEL_ORG_ID: team_4TH5lNnFHcBGx4EKNapJ2MVG

jobs:
  sync:
    name: Sync HAUSKA_ENGINE_API_KEY → Vercel PE env + prod deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_HAUSKA_PROD }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Pull retrieval key from Secret Manager
        id: key
        run: |
          set -euo pipefail
          gcloud secrets versions access latest \
            --secret=HAUSKA_ENGINE_API_KEY \
            --project=hauska-prod-497015 \
            | tr -d '\r\n' > /tmp/retrieval.key
          KEY_BYTES=$(wc -c < /tmp/retrieval.key | tr -d ' ')
          echo "key_bytes=${KEY_BYTES}"
          if [ "$KEY_BYTES" -lt 32 ]; then
            echo "retrieval key too short (${KEY_BYTES}) — abort"
            exit 1
          fi
          echo "key_bytes=${KEY_BYTES}" >> "$GITHUB_OUTPUT"

      - name: Install Vercel CLI
        run: npm install -g vercel@54.20.1

      - name: Assert property-explorer project ids (trap 1) + write .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ "$VERCEL_PROJECT_ID" != "$EXPECTED_VERCEL_PROJECT_ID" ]; then
            echo "REFUSING: VERCEL_PROJECT_ID=${VERCEL_PROJECT_ID} is not property-explorer (${EXPECTED_VERCEL_PROJECT_ID}). cmdcenter trap."
            exit 1
          fi
          if [ "$VERCEL_ORG_ID" != "$EXPECTED_VERCEL_ORG_ID" ]; then
            echo "REFUSING: VERCEL_ORG_ID=${VERCEL_ORG_ID} != ${EXPECTED_VERCEL_ORG_ID}"
            exit 1
          fi
          mkdir -p .vercel
          python3 - <<'PY'
          import json, os
          doc = {
            "projectId": os.environ["VERCEL_PROJECT_ID"],
            "orgId": os.environ["VERCEL_ORG_ID"],
            "projectName": "property-explorer",
          }
          open(".vercel/project.json", "w", encoding="utf-8").write(json.dumps(doc))
          print("wrote", doc)
          PY
          # Re-read and refuse if name/id drift
          python3 - <<'PY'
          import json, os, sys
          d = json.load(open(".vercel/project.json", encoding="utf-8"))
          if d.get("projectName") != "property-explorer":
              print("REFUSING projectName", d.get("projectName"), file=sys.stderr)
              sys.exit(1)
          if d.get("projectId") != os.environ["EXPECTED_VERCEL_PROJECT_ID"]:
              print("REFUSING projectId", d.get("projectId"), file=sys.stderr)
              sys.exit(1)
          print("project_assert_ok", d)
          PY

      - name: Preflight VERCEL_TOKEN (must be dashboard personal token)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/vercel_whoami.json -w "%{http_code}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            https://api.vercel.com/v2/user)
          echo "vercel_whoami_http=${CODE}"
          if [ "$CODE" != "200" ]; then
            echo "VERCEL_TOKEN rejected by api.vercel.com (HTTP ${CODE})."
            echo "Create a personal token at https://vercel.com/account/tokens"
            echo "and set GitHub secret VERCEL_TOKEN on empressaioemail-tech/hauska-map."
            echo "CLI OAuth tokens from auth.json are NOT valid for --token / Bearer."
            head -c 300 /tmp/vercel_whoami.json || true
            exit 1
          fi

      - name: Authoritative-replace retrieval env vars (trap 2+3+4)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          for VAR in HAUSKA_RETRIEVAL_API_KEY RETRIEVAL_API_KEY; do
            vercel env rm "$VAR" production --yes --token "$VERCEL_TOKEN" || true
            printf '%s' "$(cat /tmp/retrieval.key)" | vercel env add "$VAR" production --token "$VERCEL_TOKEN"
            echo "set ${VAR}"
          done
          # Pin OAuth redirect to www so Google Console only needs one callback URI.
          vercel env rm PE_OIDC_REDIRECT_ORIGIN production --yes --token "$VERCEL_TOKEN" || true
          printf '%s' "https://www.smartsite.cloud" | vercel env add PE_OIDC_REDIRECT_ORIGIN production --token "$VERCEL_TOKEN"
          echo "set PE_OIDC_REDIRECT_ORIGIN"

      - name: Production deploy (Vercel Root Directory = apps/property-explorer)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Project Root Directory is already apps/property-explorer in Vercel
          # settings — do NOT pass --cwd apps/property-explorer (doubles the path).
          vercel deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Live verify PE facets gold Bastrop 34137 (exit-bounded)
        run: |
          set -euo pipefail
          URL="https://property-explorer-xi.vercel.app/api/spine/property-atoms/48021:34137/facets"
          CODE=$(curl -sS -o /tmp/facets.json -w "%{http_code}" --max-time 60 "$URL")
          echo "http=${CODE}"
          if [ "$CODE" != "200" ]; then
            echo "PE facets probe failed HTTP ${CODE}"
            head -c 500 /tmp/facets.json || true
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/facets.json", encoding="utf-8"))
          rp = d.get("readPath")
          print("readPath=", rp)
          if rp != "atom-chain-warm":
              print("expected readPath atom-chain-warm", file=sys.stderr)
              sys.exit(1)
          if d.get("parcelNodeId") != "48021:34137":
              print("unexpected parcelNodeId", d.get("parcelNodeId"), file=sys.stderr)
              sys.exit(1)
          print("PE_LIVE_VERIFY_OK")
          PY
