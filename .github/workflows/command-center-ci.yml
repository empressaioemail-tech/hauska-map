name: Command Center CI

# hauska-map main requires status context "test" (this job id). Path filters
# skip this workflow on Property Explorer-only PRs, which leaves merge
# BLOCKED even when PE Typecheck/Test are green. A PE-only PR that must
# land can include this file in the diff so the pull_request event reports
# "test". workflow_dispatch on the same SHA does not satisfy the gate.
# Included in s8-land-use-surface (P-08 / WDLL 5 leftover) for that required check.
# Included in serve-pe-p48 (P-48 / WDLL 1 specialDistrictFact inspect copy).
# Included in serve-pe-p49 (P-49 / WDLL 3 pipelineFact inspect copy).
# Included in serve-pe-p50 (P-50 / WDLL 4 wellFact inspect copy).

on:
  pull_request:
    paths:
      - "apps/command-center/**"
      - "packages/map-renderer/**"
      - ".github/workflows/command-center-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/command-center/**"
      - "packages/map-renderer/**"
      - ".github/workflows/command-center-ci.yml"
  workflow_dispatch:
    inputs:
      live_smoke:
        description: "Run WDLL 8 live GREEN smoke against production retrieval"
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The shared renderer's own node:test suite was not run by ANY workflow
      # before 2026-08-18, so its guards (palette separation floors, the
      # classifier divergence tests, the crash-guard assertions) existed but
      # were never enforced. A control nobody runs is not a control.
      - name: Shared map-renderer unit tests
        run: pnpm --filter @hauska/map-renderer test
      - name: Unit + RED smoke (WDLL 7–8)
        run: pnpm --filter command-center test
      - name: Live GREEN smoke (WDLL 8)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_smoke }}
        env:
          RUN_LIVE_SMOKE: "1"
          SMOKE_RETRIEVAL_API_KEY: ${{ secrets.RETRIEVAL_API_KEY }}
        run: |
          if [ -z "$SMOKE_RETRIEVAL_API_KEY" ]; then
            echo "RETRIEVAL_API_KEY secret missing — skip live GREEN (RED path already in unit job)"
            exit 0
          fi
          pnpm --filter command-center exec vitest run src/admin/api/liveSmoke.test.ts
      # App tsc has pre-existing workspace typing debt (ActiveContextBar); vitest is the F1c gate.
