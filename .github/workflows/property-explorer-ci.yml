name: Property Explorer CI

on:
  pull_request:
    paths:
      - "apps/property-explorer/**"
      - "packages/map-renderer/**"
      - "packages/parcel-fact-sheet/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/property-explorer-ci.yml"
      # .gitattributes governs how EVERY file in this repo is checked out.
      # Without it here a line-ending policy change triggers no CI at all: the
      # file most able to break every other file was the one file this workflow
      # could not see. Found 2026-08-31 when a .gitattributes-only PR sat with
      # its required checks permanently unreported.
      - ".gitattributes"

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The frozen parcel fact-sheet contract gates the app suite: if the one
      # verdict composer or the one measurement formatter breaks, nothing
      # downstream is worth running.
      - run: pnpm --filter @empressaio/parcel-fact-sheet test
      - run: pnpm --filter property-explorer test
      - name: Records copy guard (P-85 item 16)
        run: node apps/property-explorer/scripts/records-copy-guard.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hauska/map-renderer build
      - run: pnpm --filter @empressaio/parcel-fact-sheet exec tsc --noEmit
      # The fact-sheet package resolves from SOURCE in the app (vite alias +
      # tsconfig paths), so no dist build is needed here. The dist build is
      # still exercised below because command-center consumes the package the
      # standard way.
      - run: pnpm --filter @empressaio/parcel-fact-sheet build
      - run: pnpm --filter property-explorer exec tsc --noEmit
